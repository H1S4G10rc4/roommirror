<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src 'self' blob:; style-src 'self'; script-src 'self'" />
    <title>Room mirror</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="stage">
      <video id="camera" autoplay playsinline muted></video>

      <section id="empty-state" class="empty-state" aria-live="polite">
        <p id="status">カメラを準備しています…</p>
        <button id="retry" type="button" hidden>再試行</button>
      </section>

      <header id="toolbar" class="toolbar">
        <label>
          <span>カメラ</span>
          <select id="camera-select" aria-label="表示するカメラ"></select>
        </label>
        <button id="top-toggle" type="button" aria-pressed="false">最前面</button>
        <button id="close-window" class="close-button" type="button" aria-label="閉じる">×</button>
      </header>
    </main>
    <script src="renderer.js"></script>
  </body>
</html>
